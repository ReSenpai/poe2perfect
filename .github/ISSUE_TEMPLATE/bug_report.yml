name: Bug report
description: Something in the extension does not work or looks wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste cookies, session ids or other people's account names.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Build link
      description: The address of the build you were reading. It is the single most useful thing in a report.
      placeholder: https://mobalytics.gg/poe-2/builds/…
    validations:
      required: true
  - type: dropdown
    id: tab
    attributes:
      label: Where
      options:
        - Overview
        - Skills
        - Gear
        - Passives
        - Atlas Tree
        - Progression
        - Loading the build
        - Somewhere else
    validations:
      required: true
  - type: dropdown
    id: signed-in
    attributes:
      label: Signed in to mobalytics.gg?
      description: The site renders a signed-in page differently, so this often matters.
      options:
        - 'No'
        - 'Yes'
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      description: From chrome://extensions or about:addons.
      placeholder: 1.3.0
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Edge
        - Other Chromium browser
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Optional. F12 → Console, errors mentioning poe2perfect or mobalytics.
      render: text
